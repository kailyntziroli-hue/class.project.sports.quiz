<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Quiz</title>

<p>Match the athlete with the correct team.</p>
<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff512f, #dd2476);
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
    background-color: rgba(0,0,0,0.3);
    padding: 30px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: yellow;
}

.question {
    background-color: rgba(255,255,255,0.15);
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
}

select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: none;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    background-color: yellow;
    color: black;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background-color: orange;
}

#score {
    text-align: center;
    margin-top: 30px;
    font-size: 35px;
    color: yellow;
}

</style>
</head>

<body>

<div class="container">

<h1>🏆 Sports Matching Quiz 🏆</h1>

<form id="quizForm">

<div class="question">
<p>1. Michael Jordan</p>
<select id="q1">
<option>Choose</option>
<option>Boston Celtics</option>
<option>Chicago Bulls</option>
<option>Miami Heat</option>
</select>
</div>

<div class="question">
<p>2. Larry Bird</p>
<select id="q2">
<option>Choose</option>
<option>Los Angeles Lakers</option>
<option>Dallas Mavericks</option>
<option>Boston Celtics</option>
</select>
</div>

<div class="question">
<p>3. Caleb Williams</p>
<select id="q3">
<option>Choose</option>
<option>Kansas City Chiefs</option>
<option>Chicago Bears</option>
<option>Green Bay Packers</option>
</select>
</div>

<div class="question">
<p>4. Derek Jeter</p>
<select id="q4">
<option>Choose</option>
<option>New York Mets</option>
<option>Chicago White Sox</option>
<option>New York Yankees</option>
</select>
</div>

<div class="question">
<p>5. Connor Bedard</p>
<select id="q5">
<option>Choose</option>
<option>Detroit Red Wings</option>
<option>Chicago Blackhawks</option>
<option>New Jersey Devils</option>
</select>
</div>

<div class="question">
<p>6. Kobe Bryant</p>
<select id="q6">
<option>Choose</option>
<option>Chicago Bulls</option>
<option>Los Angeles Lakers</option>
<option>Miami Heat</option>
</select>
</div>

<div class="question">
<p>7. Patrick Mahomes</p>
<select id="q7">
<option>Choose</option>
<option>Buffalo Bills</option>
<option>Kansas City Chiefs</option>
<option>New England Patriots</option>
</select>
</div>

<div class="question">
<p>8. Dansby Swanson</p>
<select id="q8">
<option>Choose</option>
<option>Miami Marlins</option>
<option>Detroit Tigers</option>
<option>Chicago Cubs</option>
</select>
</div>

<div class="question">
<p>9. Caitlin Clark</p>
<select id="q9">
<option>Choose</option>
<option>Dallas Wings</option>
<option>Indiana Fever</option>
<option>Chicago Sky</option>
</select>
</div>

<div class="question">
<p>10. Mallory Swanson</p>
<select id="q10">
<option>Choose</option>
<option>Portland Thorns</option>
<option>San Diego Wave</option>
<option>Chicago Stars</option>
</select>
</div>

<button type="button" id="submitBtn">Submit Quiz</button>

</form>

<h2 id="score"></h2>

</div>

<script>

document.getElementById("submitBtn").addEventListener("click", function() {

    let score = 0;

    if (document.getElementById("q1").value === "Chicago Bulls") {
        score += 10;
    }

    if (document.getElementById("q2").value === "Boston Celtics") {
        score += 10;
    }

    if (document.getElementById("q3").value === "Chicago Bears") {
        score += 10;
    }

    if (document.getElementById("q4").value === "New York Yankees") {
        score += 10;
    }

    if (document.getElementById("q5").value === "Chicago Blackhawks") {
        score += 10;
    }

    if (document.getElementById("q6").value === "Los Angeles Lakers") {
        score += 10;
    }

    if (document.getElementById("q7").value === "Kansas City Chiefs") {
        score += 10;
    }

    if (document.getElementById("q8").value === "Chicago Cubs") {
        score += 10;
    }

    if (document.getElementById("q9").value === "Indiana Fever") {
        score += 10;
    }

    if (document.getElementById("q10").value === "Chicago Stars") {
        score += 10;
    }

    document.getElementById("score").innerHTML =
    "🎉 Your Final Score: " + score + "/100";

});

</script>

</body>
</html>
